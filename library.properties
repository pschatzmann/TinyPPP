name=TinyPPP
version=0.1.0
author=Phil Schatzmann
maintainer=Phil Schatzmann <phil.schatzmann@gmail.com>
sentence=Header only PPP networking over any Arduino Stream (USB serial, UART) integrated into the Arduino network API.
paragraph=Uses native lwIP on ESP32 (esp_netif / NetworkInterface) and RP2040/RP2350 (arduino-pico). Other 32-bit boards (e.g. WiFiNINA boards: Nano 33 IoT, MKR WiFi 1010, Nano RP2040 Connect; UNO R4) use a small built-in TCP/IP stack. Includes a portable PPP engine (LCP, PAP, IPCP) that can be tested on the desktop with the Arduino-Emulator.
category=Communication
url=https://github.com/pschatzmann/TinyPPP
architectures=*
includes=TinyPPP.h
